spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import:
      - optional:nacos:shared-common.yaml?group=NOW_DEMO
      - optional:nacos:shared-db.yaml?group=NOW_DEMO
      - optional:nacos:shared-redis.yaml?group=NOW_DEMO
      - optional:nacos:shared-jwt.yaml?group=NOW_DEMO
      - optional:nacos:${spring.application.name}.yaml?group=NOW_DEMO
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml?group=NOW_DEMO
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        group: NOW_DEMO
        namespace: ${NACOS_NAMESPACE:dev}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        group: NOW_DEMO
        namespace: ${NACOS_NAMESPACE:dev}
        file-extension: yaml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/content_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      timeout: 3000ms
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@example.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
      mail.smtp.connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${MAIL_SMTP_READ_TIMEOUT_MS:10000}
      mail.smtp.writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT_MS:10000}

server:
  port: ${SERVER_PORT:8081}

mybatis-plus:
  type-aliases-package: com.platform.auth.entity
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  token:
    expiration: ${JWT_EXPIRATION:120}
    remember-me-expiration: ${JWT_REMEMBER_ME_EXPIRATION:10080}
    sign-key: ${JWT_SIGN_KEY}
    refresh-threshold: ${JWT_REFRESH_THRESHOLD:30}

platform:
  internal:
    token: ${INTERNAL_TOKEN:}
  auth:
    refresh-cookie-name: ${AUTH_REFRESH_COOKIE_NAME:semi_overt_refresh}
    refresh-cookie-secure: ${AUTH_REFRESH_COOKIE_SECURE:true}
    refresh-idle-days: ${AUTH_REFRESH_IDLE_DAYS:30}
    refresh-absolute-days: ${AUTH_REFRESH_ABSOLUTE_DAYS:90}
    access-token-seconds: ${ACCESS_TOKEN_TTL_SECONDS:900}
    reset-code-pepper: ${RESET_CODE_PEPPER:}
    registration-code-required: ${REGISTRATION_CODE_REQUIRED:true}
  cors:
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://semi-overt.com,https://www.semi-overt.com}
  turnstile:
    secret-key: ${TURNSTILE_SECRET_KEY:}
    connect-timeout-ms: ${TURNSTILE_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${TURNSTILE_READ_TIMEOUT_MS:5000}
  mail:
    rate-limit:
      email-hourly: ${MAIL_EMAIL_HOURLY_LIMIT:5}
      email-daily: ${MAIL_EMAIL_DAILY_LIMIT:10}
      ip-minute: ${MAIL_IP_MINUTE_LIMIT:5}
      ip-hourly: ${MAIL_IP_HOURLY_LIMIT:30}
      global-hourly: ${MAIL_GLOBAL_HOURLY_LIMIT:500}
      global-daily: ${MAIL_GLOBAL_DAILY_LIMIT:2000}
  rate-limit:
    write:
      max-requests: ${WRITE_RATE_LIMIT_MAX_REQUESTS:120}
    search:
      max-requests: ${SEARCH_RATE_LIMIT_MAX_REQUESTS:30}
  storage:
    max-uploads-per-user-per-day: ${UPLOAD_DAILY_LIMIT:100}
  reset-pwd-token-ttl-minutes: ${RESET_PWD_TOKEN_TTL_MINUTES:15}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  feign:
    connect-timeout-ms: ${FEIGN_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${FEIGN_READ_TIMEOUT_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,authDependencies
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    mail:
      enabled: false
