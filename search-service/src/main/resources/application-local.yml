# Local development profile — activated by dev-up.ps1 via spring.profiles.active=local
# Optimizations that speed up Spring context startup on developer machines.
spring:
  main:
    lazy-initialization: true
    lazy-initialization-exclude-packages: org.springframework.amqp
  jmx:
    enabled: false

logging:
  level:
    com.alibaba.nacos: WARN
    org.apache.catalina: WARN
