log_format now_demo_access
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $request_uri $server_protocol" $status $body_bytes_sent '
    'rt=$request_time urt=$upstream_response_time '
    'xff="$http_x_forwarded_for" trace="$http_x_trace_id"';

server {
    listen 80 default_server;
    server_name _;

    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    root /srv/now-demo/frontend/dist;
    index index.html;

    access_log /var/log/nginx/now-demo.access.log now_demo_access;
    error_log /var/log/nginx/now-demo.error.log warn;

    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Enable only after confirming frontend flows do not regress.
    # add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
    }

    location = /robots.txt {
        try_files $uri =404;
        access_log off;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_connect_timeout 2s;
        proxy_send_timeout 6s;
        proxy_read_timeout 6s;
        proxy_intercept_errors off;
        error_page 500 = @api_error_500;
        error_page 502 = @api_error_502;
        error_page 503 = @api_error_503;
        error_page 504 = @api_error_504;
    }

    location /static/uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_connect_timeout 2s;
        proxy_send_timeout 6s;
        proxy_read_timeout 6s;
        proxy_intercept_errors off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    location = /actuator/health {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:8080/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_connect_timeout 2s;
        proxy_send_timeout 6s;
        proxy_read_timeout 6s;
    }

    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location @api_error_500 {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
        return 500 '{"code":500,"message":"Gateway internal error","data":null}';
    }

    location @api_error_502 {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
        return 502 '{"code":502,"message":"Gateway temporarily unavailable","data":null}';
    }

    location @api_error_503 {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
        return 503 '{"code":503,"message":"Service temporarily unavailable","data":null}';
    }

    location @api_error_504 {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
        return 504 '{"code":504,"message":"Upstream service timed out","data":null}';
    }
}
