spring:
  application:
    name: review-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import:
      - optional:nacos:shared-common.yaml?group=NOW_DEMO
      - optional:nacos:shared-db.yaml?group=NOW_DEMO
      - optional:nacos:${spring.application.name}.yaml?group=NOW_DEMO
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml?group=NOW_DEMO
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        group: NOW_DEMO
        namespace: ${NACOS_NAMESPACE:dev}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        group: NOW_DEMO
        namespace: ${NACOS_NAMESPACE:dev}
        file-extension: yaml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/content_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

server:
  port: ${SERVER_PORT:8083}

mybatis-plus:
  type-aliases-package: com.platform.entity
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info
