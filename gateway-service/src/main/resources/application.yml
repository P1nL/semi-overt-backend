spring:
  application:
    name: gateway-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  webflux:
    throw-exception-if-no-handler-found: true
  config:
    import:
      - optional:nacos:shared-common.yaml?group=NOW_DEMO
      - optional:nacos:shared-redis.yaml?group=NOW_DEMO
      - optional:nacos:shared-jwt.yaml?group=NOW_DEMO
      - optional:nacos:${spring.application.name}.yaml?group=NOW_DEMO
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml?group=NOW_DEMO
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        group: NOW_DEMO
        namespace: ${NACOS_NAMESPACE:dev}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        group: NOW_DEMO
        namespace: ${NACOS_NAMESPACE:dev}
        file-extension: yaml
    gateway:
      httpclient:
        connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:6s}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}

server:
  port: ${SERVER_PORT:8080}

jwt:
  token:
    expiration: ${JWT_EXPIRATION:120}
    remember-me-expiration: ${JWT_REMEMBER_ME_EXPIRATION:10080}
    sign-key: ${JWT_SIGN_KEY:bXktc3VwZXItc2VjdXJlLWtleS1mb3Itand0LXNpZ25pbmctbmVlZHMtdG8tYmUtbG9uZy1lbm91Z2g=}
    refresh-threshold: ${JWT_REFRESH_THRESHOLD:30}

platform:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  gateway:
    rate-limit:
      replenish-rate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:30}
      burst-capacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:60}
      requested-tokens: ${GATEWAY_RATE_LIMIT_REQUESTED_TOKENS:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,redis,nacosTcp
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
