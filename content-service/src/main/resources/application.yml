spring:
  application:
    name: content-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import:
      - optional:nacos:shared-common.yaml?group=NOW_DEMO
      - optional:nacos:shared-db.yaml?group=NOW_DEMO
      - optional:nacos:shared-redis.yaml?group=NOW_DEMO
      - optional:nacos:${spring.application.name}.yaml?group=NOW_DEMO
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml?group=NOW_DEMO
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        group: NOW_DEMO
        namespace: ${NACOS_NAMESPACE:dev}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        group: NOW_DEMO
        namespace: ${NACOS_NAMESPACE:dev}
        file-extension: yaml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/content_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      timeout: 3000ms

server:
  port: ${SERVER_PORT:8082}

mybatis-plus:
  type-aliases-package: com.platform.content.entity
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

platform:
  ai:
    polish:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      endpoint: ${AI_POLISH_ENDPOINT:}
      api-key: ${DEEPSEEK_API_KEY:${AI_POLISH_API_KEY:}}
      model: ${DEEPSEEK_MODEL:${AI_POLISH_MODEL:deepseek-flash}}
      proxy-url: ${DEEPSEEK_PROXY_URL:}
      timeout-seconds: ${AI_POLISH_TIMEOUT_SECONDS:45}
      max-tokens: ${AI_POLISH_MAX_TOKENS:8192}
  feign:
    connect-timeout-ms: ${FEIGN_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${FEIGN_READ_TIMEOUT_MS:5000}
  events:
    outbox-publish-delay-ms: ${EVENT_OUTBOX_PUBLISH_DELAY_MS:5000}
    retry-delay-ms: ${EVENT_RETRY_DELAY_MS:30000}
    consumer-max-retries: ${EVENT_CONSUMER_MAX_RETRIES:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,contentDependencies
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
